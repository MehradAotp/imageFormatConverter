<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Converter Pro Settings</title><link rel="stylesheet" href="options.css"></head><body><main class="card"><div class="eyebrow">IMAGE CONVERTER PRO</div><h1>Preferences</h1><p class="intro">Fine-tune output quality, dimensions, and file naming. Everything is processed locally.</p><section><h2>Quality</h2><label>WebP <output id="webpQualityValue"></output><input id="webpQuality" type="range" min="0.1" max="1" step="0.01"></label><label>JPG <output id="jpgQualityValue"></output><input id="jpgQuality" type="range" min="0.1" max="1" step="0.01"></label><label>AVIF <output id="avifQualityValue"></output><input id="avifQuality" type="range" min="0.1" max="1" step="0.01"></label></section><section><h2>Resize</h2><div class="row"><label>Max width<input id="maxWidth" type="number" min="0" placeholder="Original"></label><label>Max height<input id="maxHeight" type="number" min="0" placeholder="Original"></label></div><small class="hint">Leave blank or set 0 to preserve the original dimensions.</small></section><section><h2>Output</h2><label>Filename<select id="filenameMode"><option value="original">Original filename</option><option value="timestamp">Timestamp</option></select></label><label>JPG background<input id="jpegBackground" type="color"></label></section><button id="save">Save preferences</button><p id="status" role="status" aria-live="polite"></p></main><script src="options.js"></script></body></html>
