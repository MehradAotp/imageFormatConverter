<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image Format Converter Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main class="card">
    <h1>Image Format Converter</h1>
    <p class="intro">Choose the quality and naming rules used when converting images.</p>

    <label>
      WebP quality <output id="webpQualityValue">92%</output>
      <input id="webpQuality" type="range" min="0.1" max="1" step="0.01">
    </label>

    <label>
      JPG quality <output id="jpgQualityValue">90%</output>
      <input id="jpgQuality" type="range" min="0.1" max="1" step="0.01">
    </label>

    <label>
      Filename
      <select id="filenameMode">
        <option value="original">Use the original filename</option>
        <option value="timestamp">Use a timestamp</option>
      </select>
    </label>

    <button id="save">Save settings</button>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script src="options.js"></script>
</body>
</html>
